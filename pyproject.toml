[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "egrant-ai-agent"
version = "0.2.0"
description = "Grounded document extraction proposals for human review in eGrant"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.8,<3",
  "pydantic-ai-slim[openai]>=1.0,<2",
  "httpx>=0.28,<1",
  "openpyxl>=3.1,<4",
  "defusedxml>=0.7.1,<1",
]

[dependency-groups]
dev = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=1,<2",
  "ruff>=0.11,<1",
  "pytest-socket>=0.7,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["app", "configs"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q --allow-hosts=127.0.0.1,::1 --allow-unix-socket"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E501"]
